<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>库库AI · 摄影影楼版 Demo</title>
<style>
:root{
  --t1:#191c1f;--t2:#2e3033;--t3:#636466;--t4:#969799;--t5:#c1c1c2;
  --bg:#fff;--bg2:#f6f6f6;--bg3:#ebebeb;--line:#ebebeb;--line2:#dfdfe0;
  --mask:rgba(25,28,31,.05);--mask2:rgba(25,28,31,.08);
  --ai:#2970ff;--ai-bg:#eef3ff;--info:#0c83f2;
  --ok:#01a77d;--ok-bg:#e9f6f3;--warn:#ff7d00;--warn-bg:#fff4e8;--err:#f53d3d;--err-bg:#fdecea;
  --shadow-nav:0 1px 6px rgba(0,0,0,.09);
  --shadow-pop:0 6px 14px rgba(0,0,0,.08);
  --shadow-float:0 16px 48px rgba(25,28,31,.16),0 2px 6px rgba(25,28,31,.06);
  --font:"PingFang SC",-apple-system,BlinkMacSystemFont,"Helvetica Neue","Microsoft YaHei",Arial,sans-serif;
}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:var(--font);font-size:14px;color:var(--t1);background:var(--bg);-webkit-font-smoothing:antialiased;overflow:hidden}
button{font:inherit;color:inherit;background:none;border:0;padding:0;cursor:pointer}
input,textarea,select{font:inherit;color:inherit}
svg{display:block;flex:none}
.app{display:grid;grid-template-columns:248px minmax(0,1fr);height:100vh}

/* ---------- sidebar ---------- */
.sidebar{background:var(--bg2);display:flex;flex-direction:column;min-height:0;padding:14px 10px 12px}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:2px 8px 12px}
.sb-logo{font-size:21px;font-weight:600;letter-spacing:.5px;display:flex;align-items:center;gap:6px}
.sb-icon-btn{width:28px;height:28px;border-radius:6px;display:inline-flex;align-items:center;justify-content:center;color:var(--t4)}
.sb-icon-btn:hover{background:var(--mask)}
.sb-nav{display:flex;flex-direction:column;gap:2px}
.sb-item{height:36px;border-radius:8px;display:flex;align-items:center;gap:10px;padding:0 10px;font-size:14px;color:var(--t1);width:100%;text-align:left;position:relative}
.sb-item:hover{background:var(--mask)}
.sb-item.is-active{background:var(--mask2);font-weight:500}
.sb-item .sb-badge{margin-left:auto;min-width:18px;height:18px;border-radius:9px;background:var(--err);color:#fff;font-size:11px;display:inline-flex;align-items:center;justify-content:center;padding:0 5px}
.sb-scroll{flex:1;min-height:0;overflow-y:auto;margin-top:10px;padding:6px 0 18px;border-top:.5px solid var(--line2);-webkit-mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent);mask-image:linear-gradient(180deg,#000 calc(100% - 28px),transparent)}
.sb-scroll::-webkit-scrollbar{width:6px}.sb-scroll::-webkit-scrollbar-thumb{background:var(--line2);border-radius:6px}
.sb-group{margin-top:10px}
.sb-group-head{height:30px;display:flex;align-items:center;justify-content:space-between;padding:0 10px;font-size:14px;font-weight:500;color:var(--t1)}
.sb-group-head .gl{display:flex;align-items:center;gap:4px}
.sb-group-head .gl svg{color:var(--t4)}
.sb-group-head .gr{display:flex;gap:2px;color:var(--t4)}
.sb-sub{height:34px;border-radius:8px;display:flex;align-items:center;gap:8px;padding:0 10px;font-size:14px;color:var(--t1);width:100%;text-align:left;white-space:nowrap;overflow:hidden}
.sb-sub span.txt{overflow:hidden;text-overflow:ellipsis}
.sb-sub:hover{background:var(--mask)}
.sb-sub.is-active{background:var(--mask2)}
.sb-sub .tool-dot{width:18px;height:18px;border-radius:5px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.sb-sub .new-tag{margin-left:auto;font-size:11px;color:var(--ai);background:var(--ai-bg);border-radius:4px;padding:1px 5px}
.sb-foot{display:flex;align-items:center;gap:10px;padding:10px 8px 0}
.sb-avatar{width:28px;height:28px;border-radius:50%;background:linear-gradient(135deg,#d9dce1,#b9bec6);flex:none}
.sb-user{flex:1;font-size:14px;color:var(--t1)}

/* ---------- main ---------- */
.main{position:relative;min-width:0;min-height:0;overflow:hidden;background:var(--bg)}
.view{height:100%;overflow:auto}
.top-actions{position:absolute;top:14px;right:18px;display:flex;align-items:center;gap:10px;z-index:5}
.btn{height:32px;border-radius:8px;padding:0 14px;display:inline-flex;align-items:center;gap:6px;font-size:13px;white-space:nowrap;transition:background .15s}
.btn-line{border:1px solid var(--line);background:#fff}
.btn-line:hover{background:var(--bg2)}
.btn-dark-line{border:1px solid var(--t1);background:#fff;font-weight:500}
.btn-dark{background:var(--t1);color:#fff;font-weight:500}
.btn-dark:hover{background:#2e3033}
.btn-ghost{color:var(--t3)}
.btn-ghost:hover{background:var(--bg2);color:var(--t1)}
.btn-sm{height:28px;padding:0 10px;font-size:12px;border-radius:7px}
.icon-btn{width:32px;height:32px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--t3)}
.icon-btn:hover{background:var(--bg2);color:var(--t1)}
.pill{display:inline-flex;align-items:center;gap:4px;height:22px;padding:0 8px;border-radius:11px;font-size:12px;white-space:nowrap}
.pill-ok{background:var(--ok-bg);color:var(--ok)}
.pill-err{background:var(--err-bg);color:var(--err)}
.pill-warn{background:var(--warn-bg);color:var(--warn)}
.pill-gray{background:var(--bg2);color:var(--t3)}
.pill-ai{background:var(--ai-bg);color:var(--ai)}
.dot{width:6px;height:6px;border-radius:50%;display:inline-block}
.muted{color:var(--t3)}
.tnum{font-variant-numeric:tabular-nums}

/* ---------- toast ---------- */
.toast-host{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);display:flex;flex-direction:column;gap:8px;z-index:100;pointer-events:none}
.toast{background:var(--t1);color:#fff;border-radius:10px;padding:10px 14px;font-size:13px;display:flex;align-items:center;gap:12px;box-shadow:var(--shadow-pop);pointer-events:auto;animation:toastIn .2s ease}
.toast button{color:#8fb3ff;font-weight:500}
@keyframes toastIn{from{opacity:0;transform:translateY(6px)}to{opacity:1;transform:none}}
.fade-in{animation:fadeIn .25s ease}
@keyframes fadeIn{from{opacity:0}to{opacity:1}}
.flash{animation:flash 1.6s ease}
@keyframes flash{0%,30%{background:rgba(41,112,255,.12)}100%{background:transparent}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

</style>
<style>
/* ---------- home ---------- */
.home{min-height:100%;display:flex;flex-direction:column;align-items:center;padding:12vh 40px 120px}
.home-inner{width:100%;max-width:960px;display:flex;flex-direction:column;align-items:center}
.big-title{font-size:34px;font-weight:600;letter-spacing:1px;margin:0 0 22px;line-height:1.2}
.scene-tabs{position:relative;display:flex;gap:2px;background:var(--bg3);border-radius:40px;padding:2px;height:36px}
.scene-tab{position:relative;z-index:1;min-width:96px;height:32px;border-radius:40px;padding:0 12px;font-size:14px;font-weight:500;color:var(--t2);display:inline-flex;align-items:center;justify-content:center;gap:4px;transition:color .15s}
.scene-tab:hover{color:var(--t3)}
.scene-tab.is-active{background:var(--t1);color:#fff}
.scene-tab .new{width:6px;height:6px;border-radius:50%;background:var(--err);margin-left:2px;margin-top:-8px}

/* experts row (above composer) */
.experts{width:100%;margin-top:34px}
.sec-title{font-size:14px;font-weight:500;color:var(--t4);display:flex;align-items:center;justify-content:space-between;margin-bottom:6px}
.sec-title .more{font-size:12px;font-weight:400;color:var(--t4);display:inline-flex;align-items:center;gap:2px}
.sec-title .more:hover{color:var(--t1)}
.expert-row{display:flex;align-items:center;gap:6px;margin-left:-10px;overflow:hidden}
.expert{display:inline-flex;align-items:center;gap:8px;height:40px;padding:0 10px;border-radius:8px;font-size:14px;font-weight:500;color:var(--t1);white-space:nowrap}
.expert:hover{background:var(--bg2)}
.expert.is-on{background:var(--bg2)}
.expert img,.av{width:24px;height:24px;border-radius:50%;object-fit:cover;flex:none;background:var(--bg3)}
.expert .chev{color:var(--t1);margin-left:-2px}
.expert-sep{flex:1}

/* composer */
.composer-wrap{width:100%;background:var(--bg2);border-radius:18px;margin-top:8px}
.composer{background:#fff;border:1px solid var(--line2);border-radius:16px;padding:14px 16px 10px;transition:border-color .15s,box-shadow .15s}
.composer.is-focus,.composer:focus-within{border-color:var(--t1)}
.composer textarea{width:100%;border:0;outline:0;resize:none;font-size:15px;line-height:22px;min-height:66px;background:transparent;color:var(--t1)}
.composer textarea::placeholder{color:var(--t5)}
.cbar{display:flex;align-items:center;gap:6px;margin-top:4px}
.cbtn{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:var(--t2)}
.cbtn:hover{background:var(--bg2)}
.cbar .grow{flex:1}
.send{width:32px;height:32px;border-radius:50%;background:var(--t1);color:#fff;display:inline-flex;align-items:center;justify-content:center}
.send:disabled{background:var(--bg3);color:#fff;cursor:default}
.xchip{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 6px 0 4px;border-radius:14px;background:var(--ai-bg);color:var(--ai);font-size:13px;font-weight:500}
.xchip img{width:20px;height:20px;border-radius:50%}
.xchip .x{width:18px;height:18px;border-radius:50%;display:inline-flex;align-items:center;justify-content:center;color:var(--ai)}
.xchip .x:hover{background:rgba(41,112,255,.12)}
.cfoot{display:flex;align-items:center;gap:18px;padding:10px 18px 11px;font-size:13px;color:var(--t2)}
.cfoot span{display:inline-flex;align-items:center;gap:4px;cursor:pointer}
.cfoot svg{color:var(--t3)}

/* top skills chips (other workbenches) */
.skill-chips{width:100%;display:flex;gap:8px;margin-top:34px;overflow:hidden}
.skill-chip{height:32px;border:1px solid var(--line);border-radius:10px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:14px;white-space:nowrap;background:#fff}
.skill-chip:hover{background:var(--bg2)}
.et-row{width:100%;display:grid;grid-template-columns:1fr 1fr;gap:24px;margin-top:64px}
.et-row .items{display:flex;gap:6px;margin-left:-10px}

/* tools section */
.tools{width:100%;margin-top:46px}
.tool-tabs{display:flex;align-items:flex-end;gap:26px;margin-bottom:16px}
.tool-tab{position:relative;font-size:18px;font-weight:600;color:var(--t4);padding-bottom:8px}
.tool-tab.is-active{color:var(--t1)}
.tool-tab.is-active:after{content:"";position:absolute;left:0;right:0;bottom:0;height:3px;border-radius:2px;background:var(--t1)}
.tool-tab .quick{position:absolute;top:-10px;right:-30px;font-size:11px;font-weight:500;color:var(--ai);background:#e8f0ff;border-radius:7px 7px 7px 2px;padding:1px 5px}
.tool-grid{display:grid;grid-template-columns:200px 200px minmax(0,1fr);gap:12px}
.tcard{position:relative;overflow:hidden;height:184px;border-radius:18px;background:#fff;border:1px solid var(--line);padding:20px 18px;text-align:left;display:flex;flex-direction:column;transition:box-shadow .2s,transform .2s}
.tcard:before{content:"";position:absolute;left:-30px;top:-46px;width:190px;height:120px;border-radius:50%;filter:blur(26px);opacity:.75;pointer-events:none}
.tcard.c-blue:before{background:radial-gradient(closest-side,#bdeefb,#d6e8ff 60%,transparent)}
.tcard.c-green:before{background:radial-gradient(closest-side,#d7f5d3,#e9f8dc 60%,transparent)}
.tcard:hover{box-shadow:0 8px 24px rgba(25,28,31,.08);transform:translateY(-1px)}
.tcard h4{position:relative;margin:0 0 8px;font-size:18px;font-weight:600}
.tcard p{position:relative;margin:0;font-size:13px;line-height:19px;color:var(--t3)}
.tcard .ic{position:relative;margin-top:auto;color:var(--t1)}
.tcard .meta{position:absolute;right:16px;bottom:18px;font-size:12px;color:var(--t4);display:flex;align-items:center;gap:5px}
.tpanel{border-radius:18px;background:#fff;border:1px solid var(--line);display:grid;grid-template-columns:repeat(4,1fr);grid-template-rows:1fr 1fr;overflow:hidden}
.tcell{display:flex;align-items:center;gap:8px;padding:0 14px;font-size:14px;color:var(--t1);position:relative;text-align:left;white-space:nowrap;min-width:0}
.tcell:hover{background:var(--bg2)}
.tcell:after{content:"";position:absolute;right:0;top:22%;bottom:22%;width:1px;background:var(--line)}
.tcell:nth-child(4n):after{display:none}
.tcell:nth-child(-n+4){border-bottom:1px solid var(--line)}
.tcell .spark{color:#f5b301;font-size:12px;margin-left:-4px}
.tcell .soon{position:absolute;top:10px;right:10px;font-size:10px;color:var(--t4)}

/* skills tab */
.skill-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.skill-card{border:1px solid var(--line);border-radius:14px;padding:14px 16px;display:flex;flex-direction:column;gap:6px;text-align:left;background:#fff}
.skill-card:hover{background:var(--bg2)}
.skill-card .h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:600}
.skill-card .h .tag{margin-left:auto}
.skill-card .d{font-size:12px;color:var(--t3);line-height:18px}
.conn-title{font-size:14px;font-weight:500;color:var(--t4);margin:22px 0 8px}
.conn-list{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.conn{border:1px solid var(--line);border-radius:14px;padding:12px 14px;display:flex;align-items:center;gap:10px;background:#fff}
.conn .lg{width:30px;height:30px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;font-size:13px;font-weight:600;flex:none}
.conn .n{font-size:14px;font-weight:500}
.conn .s{font-size:12px;color:var(--t4)}
.conn .st{margin-left:auto}

.custom-home{position:absolute;right:28px;bottom:26px;height:38px;border-radius:19px;padding:0 16px;background:#fff;box-shadow:var(--shadow-nav);display:inline-flex;align-items:center;gap:6px;font-size:14px;z-index:4}
.custom-home:hover{background:var(--bg2)}

</style>
<style>
/* ---------- tool page shell ---------- */
.tool{min-height:100%;display:flex;flex-direction:column}
.tool-head{position:sticky;top:0;z-index:6;height:56px;flex:none;display:flex;align-items:center;gap:10px;padding:0 18px 0 12px;border-bottom:1px solid var(--line);background:rgba(255,255,255,.96);backdrop-filter:blur(8px)}
.tool-ico{width:28px;height:28px;border-radius:8px;display:inline-flex;align-items:center;justify-content:center;color:#fff;flex:none}
.ti-blue{background:linear-gradient(135deg,#4bb8ff,#2970ff)}
.ti-green{background:linear-gradient(135deg,#3fd29b,#0fa77a)}
.tool-name{font-size:16px;font-weight:600}
.tool-head .crumb{font-size:13px;color:var(--t4);display:flex;align-items:center;gap:4px}
.tool-head .crumb button:hover{color:var(--t1)}
.ver{height:24px;padding:0 8px;border-radius:6px;background:var(--bg2);font-size:12px;color:var(--t3);display:inline-flex;align-items:center;gap:4px}
.ver:hover{background:var(--bg3)}
.ver.is-new{background:var(--ai-bg);color:var(--ai)}
.src{font-size:12px;color:var(--t4);display:inline-flex;align-items:center;gap:6px;margin-left:4px}
.src .dot{background:var(--ok)}
.tool-head .sp{flex:1}
.tool-body{flex:1;padding:18px 24px 110px;max-width:1280px;width:100%;transition:padding-right .2s ease}
.asst-open .tool-body{padding-right:448px;max-width:none}
.asst-open .grid-2,.asst-open .grid-3{grid-template-columns:minmax(0,1fr)}
.asst-open .grid-2.two{grid-template-columns:1fr 1fr}
.asst-open .kpi .v{font-size:22px}
.tbl-wrap{overflow-x:auto}
.filters{display:flex;align-items:center;gap:10px;margin-bottom:18px;flex-wrap:wrap}
.seg{display:inline-flex;background:var(--bg2);border-radius:8px;padding:2px;gap:2px}
.seg button{height:28px;padding:0 12px;border-radius:6px;font-size:13px;color:var(--t3)}
.seg button.is-active{background:#fff;color:var(--t1);font-weight:500;box-shadow:0 1px 2px rgba(0,0,0,.06)}
.sel{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;font-size:13px;background:#fff}
.sel:hover{background:var(--bg2)}
.search{height:32px;border:1px solid var(--line);border-radius:8px;padding:0 10px;display:inline-flex;align-items:center;gap:6px;color:var(--t4);width:220px}
.search input{border:0;outline:0;flex:1;min-width:0;font-size:13px;background:transparent}
.switch{display:inline-flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);cursor:pointer;margin-left:auto}
.switch i{width:32px;height:18px;border-radius:9px;background:var(--bg3);position:relative;transition:background .15s}
.switch i:after{content:"";position:absolute;left:2px;top:2px;width:14px;height:14px;border-radius:50%;background:#fff;box-shadow:0 1px 2px rgba(0,0,0,.2);transition:left .15s}
.switch.is-on i{background:var(--t1)}
.switch.is-on i:after{left:16px}

/* kpi strip */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(128px,1fr));overflow:hidden;border:1px solid var(--line);border-radius:14px;margin-bottom:16px}
.kpis.k6{grid-template-columns:repeat(auto-fit,minmax(150px,1fr))}
.kpi{padding:14px 18px;position:relative;box-shadow:-1px 0 0 var(--line),0 -1px 0 var(--line);min-width:0}
.asst-open .kpi{padding:12px 14px}
.asst-open .c-opt{display:none}
.asst-open .kpis{grid-template-columns:repeat(auto-fit,minmax(100px,1fr))}
.asst-open .kpis.k6{grid-template-columns:repeat(3,minmax(0,1fr))}
.asst-open .kpi .c{font-size:11px;line-height:16px}
.asst-open .search{width:auto;flex:1 1 120px;min-width:120px;max-width:220px}
.asst-open .switch{margin-left:0}
.tbl .pill .pt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.asst-open .tbl .pill{max-width:132px}
.asst-open .tbl th,.asst-open .tbl td{padding:0 8px}
.asst-open .tbl .oid{display:none}
@media (max-width:1400px){.asst-open .kpis:not(.k6) .kpi .c{display:none}.asst-open .kpi .v{font-size:20px}}
.kpi .l{font-size:13px;color:var(--t3);display:flex;align-items:center;gap:6px}
.kpi .v{font-size:26px;font-weight:600;margin-top:6px;letter-spacing:.3px}
.kpi .v small{font-size:13px;font-weight:400;color:var(--t3);margin-left:3px}
.kpi .c{font-size:12px;margin-top:2px;color:var(--t4)}
.kpi .up{color:var(--ok)}.kpi .down{color:var(--err)}
.kpi.is-err .v{color:var(--err)}

/* panels */
.grid-2{display:grid;grid-template-columns:minmax(0,1fr) 300px;gap:16px;align-items:start}
.panel{border:1px solid var(--line);border-radius:14px;background:#fff;position:relative}
.panel+.panel{margin-top:16px}
.grid-2>.panel,.grid-3>.panel{margin-top:0}
.grid-2.two{grid-template-columns:1fr 1fr}
.panel-h{height:48px;display:flex;align-items:center;gap:8px;padding:0 16px;border-bottom:1px solid var(--line)}
.panel-h h3{margin:0;font-size:15px;font-weight:600}
.panel-h .sub{font-size:12px;color:var(--t4)}
.panel-h .sp{flex:1}
.panel-b{padding:12px 16px}
.ai-edit{opacity:0;height:24px;padding:0 8px;border-radius:6px;font-size:12px;color:var(--ai);background:var(--ai-bg);display:inline-flex;align-items:center;gap:4px;transition:opacity .15s}
.panel:hover .ai-edit,.ai-edit:focus-visible{opacity:1}
.panel.is-target{box-shadow:0 0 0 2px var(--ai)}

/* table */
.tbl{width:100%;border-collapse:collapse;font-size:13px}
.tbl th{height:38px;text-align:left;font-weight:500;color:var(--t4);padding:0 10px;border-bottom:1px solid var(--line);white-space:nowrap;font-size:12px}
.tbl td{height:52px;padding:0 10px;border-bottom:1px solid var(--line);white-space:nowrap}
.tbl tr:last-child td{border-bottom:0}
.tbl tbody tr{cursor:pointer;transition:background .12s}
.tbl tbody tr:hover{background:#fafafa}
.tbl .who{display:flex;flex-direction:column;gap:2px}
.tbl .who b{font-weight:500;font-size:13px}
.tbl .who span{font-size:12px;color:var(--t4)}
.tbl .num{font-variant-numeric:tabular-nums}
.tbl .bad{color:var(--err);font-weight:500}
.tbl .std{color:var(--t4)}
.tbl th:first-child,.tbl td:first-child{padding-left:16px}
.tbl th:last-child,.tbl td:last-child{padding-right:16px}
.tbl .lnk{color:var(--ai)}
.tbl tr.is-new td{animation:flash 1.8s ease}
.col-new{animation:flash 1.8s ease}
.empty{padding:28px;text-align:center;color:var(--t4);font-size:13px}

/* rank + rules */

.rank-row img{width:24px;height:24px;border-radius:50%;object-fit:cover}
.bar{height:6px;border-radius:3px;background:var(--bg2);overflow:hidden}
.bar i{display:block;height:100%;border-radius:3px;background:var(--t1)}
.bar i.low{background:var(--err)}
.rules{display:flex;flex-direction:column;gap:10px;font-size:13px}
.rule{display:flex;align-items:center;justify-content:space-between}
.rule b{font-weight:600;font-variant-numeric:tabular-nums}
.rule.is-changed b{color:var(--ai)}
.rule-note{font-size:12px;line-height:19px;color:var(--t3);background:var(--bg2);border-radius:8px;padding:8px 10px}

/* floating trigger */
.ai-fab{position:absolute;right:24px;bottom:24px;z-index:20;display:inline-flex;align-items:center;height:44px;border-radius:22px;background:#fff;box-shadow:var(--shadow-float);padding:4px}
.ai-fab button{height:36px;border-radius:18px;display:inline-flex;align-items:center;gap:8px;padding:0 14px 0 6px;font-size:14px;font-weight:500}
.ai-fab button:hover{background:var(--bg2)}
.ai-fab .fab-edit{padding:0 14px;gap:6px;color:var(--t2)}
.ai-fab .div{width:1px;height:18px;background:var(--line)}
.orb{width:26px;height:26px;border-radius:50%;flex:none;background:radial-gradient(circle at 32% 28%,#e7fdff 0,#7fe3ff 18%,#2db4ff 48%,#1f6fe5 78%,#1d4fc4 100%);box-shadow:inset -2px -3px 6px rgba(10,40,120,.35),0 2px 6px rgba(41,112,255,.35)}
.orb.lg{width:64px;height:64px;box-shadow:inset -6px -8px 16px rgba(10,40,120,.35),0 8px 24px rgba(41,112,255,.3)}

</style>
<style>
/* ---------- QC drawer ---------- */
.drawer-mask{position:absolute;inset:0;background:rgba(25,28,31,.18);z-index:30;animation:fadeIn .15s ease}
.drawer{position:absolute;top:0;right:0;bottom:0;width:560px;max-width:92%;background:#fff;z-index:31;box-shadow:var(--shadow-float);display:flex;flex-direction:column;animation:slideIn .22s ease}
@keyframes slideIn{from{transform:translateX(24px);opacity:0}to{transform:none;opacity:1}}
.drawer-h{padding:16px 20px;border-bottom:1px solid var(--line);display:flex;align-items:flex-start;gap:12px}
.drawer-h h3{margin:0;font-size:17px;font-weight:600}
.drawer-h .meta{font-size:12px;color:var(--t4);margin-top:4px;line-height:18px}
.drawer-h .sp{flex:1}
.drawer-b{flex:1;overflow:auto;padding:12px 20px 20px}
.drawer-f{padding:12px 20px;border-top:1px solid var(--line);display:flex;gap:8px;justify-content:flex-end}
.costume{padding:12px 0;border-bottom:1px solid var(--line)}
.costume:last-child{border-bottom:0}
.costume-h{display:flex;align-items:center;gap:8px;font-size:14px;font-weight:500;margin-bottom:8px}
.costume-h .sp{flex:1}
.counts{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px}
.cnt{height:24px;border-radius:6px;padding:0 8px;font-size:12px;display:inline-flex;align-items:center;gap:4px;background:var(--bg2);color:var(--t2)}
.cnt.bad{background:var(--err-bg);color:var(--err)}
.photos{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.ph{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--bg2)}
.ph img{width:100%;height:100%;object-fit:cover;display:block}
.ph.blur img{filter:blur(2.4px)}
.ph.dim img{opacity:.55}
.ph .flag{position:absolute;left:4px;top:4px;font-size:10px;line-height:16px;padding:0 5px;border-radius:4px;color:#fff;background:rgba(25,28,31,.72)}
.ph .flag.dup{background:rgba(255,125,0,.92)}
.ph .flag.err{background:rgba(245,61,61,.92)}
.ai-note{display:flex;gap:8px;align-items:flex-start;font-size:12px;line-height:18px;color:var(--t2);background:var(--ai-bg);border-radius:8px;padding:8px 10px;margin-top:10px}
.ai-note .orb{width:16px;height:16px;margin-top:1px}
.sample-note{font-size:11px;color:var(--t4);margin-top:12px}

.kpis.k6 .v{font-size:24px}
.kpi .delta{font-weight:500;margin-left:4px}
.kpi.is-new{animation:flash 1.8s ease}
.chart-wrap{padding:8px 16px 12px}
.chart{width:100%;height:220px;display:block}
.chart .grid line{stroke:var(--line)}
.chart .axis text{fill:var(--t4);font-size:11px}
.chart .line{fill:none;stroke:var(--t1);stroke-width:2}
.chart .area{fill:url(#areaGrad)}
.chart .wk{fill:var(--bg2)}
.chart .pt{fill:#fff;stroke:var(--t1);stroke-width:2}
.chart-legend{display:flex;gap:14px;font-size:12px;color:var(--t3);padding:0 16px 12px}
.chart-legend i{display:inline-block;width:10px;height:10px;border-radius:2px;margin-right:5px;vertical-align:-1px}
.hbars{display:flex;flex-direction:column;gap:12px;padding:6px 0}
.hbar{display:grid;grid-template-columns:72px 1fr 92px;align-items:center;gap:10px;font-size:13px}
.hbar .bar{height:8px}
.hbar .v{text-align:right;color:var(--t2);font-variant-numeric:tabular-nums;white-space:nowrap}
.alerts{display:flex;flex-direction:column}
.alert{display:flex;gap:10px;padding:12px 0;border-bottom:1px solid var(--line);align-items:flex-start}
.alert:last-child{border-bottom:0}
.alert .lv{width:8px;height:8px;border-radius:50%;margin-top:6px;flex:none}
.alert .t{font-size:13px;line-height:20px}
.alert .d{font-size:12px;color:var(--t4);margin-top:2px}
.alert .go{margin-left:auto;font-size:12px;color:var(--ai);white-space:nowrap;margin-top:2px}
.grid-3{display:grid;grid-template-columns:minmax(0,1.6fr) minmax(0,1fr);gap:16px;margin-top:16px;align-items:start}
.pk-rank{color:var(--t4);width:18px;display:inline-block}

</style>
<style>

.asst{position:absolute;top:68px;right:20px;bottom:20px;width:404px;z-index:40;background:#fff;border:1px solid var(--line);border-radius:18px;box-shadow:var(--shadow-float);display:flex;flex-direction:column;overflow:hidden;animation:asstIn .22s ease}

.card{border:1px solid var(--line2);border-radius:12px;padding:12px 14px;margin-top:6px;background:#fff}
.card .ch{display:flex;align-items:center;gap:6px;font-size:13px;font-weight:600;margin-bottom:8px}

.diff b{color:var(--ai);font-weight:600}
.impact{font-size:12px;line-height:19px;color:var(--t2);background:var(--bg2);border-radius:8px;padding:8px 10px;margin-top:8px}

.card .file .fi{width:34px;height:34px;border-radius:8px;background:#e9f6ef;color:#0f9d58;display:inline-flex;align-items:center;justify-content:center;font-size:11px;font-weight:700}

.opts{display:flex;flex-direction:column;gap:6px;margin-top:8px}

.qchip{height:30px;border:1px solid var(--line);border-radius:8px;padding:0 9px;font-size:13px;display:inline-flex;align-items:center;gap:5px;white-space:nowrap;background:#fff;flex:none}

.chat{height:100%;display:flex;flex-direction:column}

.toolcard{display:flex;align-items:center;gap:12px;border:1px solid var(--line);border-radius:12px;padding:12px 14px;margin-top:8px;max-width:520px;text-align:left;width:100%;background:#fff}

    for(let d=1; d<=31; d++){

<script>
/* 状态、路由、通用方法、事件分发 */
(function(){
  const clone = o => JSON.parse(JSON.stringify(o));
  KK.clone = clone;
  KK.state = {
    route:{ name:'home' },
    wb:'photo', homeTab:'tools', mounted:null, draft:'',
    chat:{ expert:null, msgs:[] },
    qc:{ rules:clone(KK.qcRulesDefault), showGuide:false, onlyFail:false, groupBy:'order', rankTop:false, day:'y',
         drawer:null, changed:{}, flashCols:false },
    biz:{ store:'all', renew:false, focus:false, hide:[], version:2, flash:null },
    asst:{ open:false, tool:null, mode:'use', ref:null },
    edit:{ open:false, ref:null, draft:null, msgs:[], typing:false },
    asstMsgs:{ qc:[], biz:[] },
    history:{ qc:[], biz:[] },
    automations:[]
  };
  const S = KK.state;
  KK.esc = s => String(s==null?'':s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  KK.fmt = n => Number(n).toLocaleString('en-US');
  KK.money = n => n>=10000 ? '¥'+(n/10000).toFixed(1)+' 万' : '¥'+KK.fmt(n);
  KK.letterAv = (t, color, size) => {
    size = size || 24;
    return '<span class="av" style="width:'+size+'px;height:'+size+'px;display:inline-flex;align-items:center;justify-content:center;font-size:'+Math.round(size*.46)+'px;font-weight:600;color:#fff;background:'+(color||'#868e96')+'">'+KK.esc(t)+'</span>';
  };
  KK.expert = id => KK.experts.find(e=>e.id===id);

  /* toast */
  KK.toast = function(msg, label, fn){
    const host = document.getElementById('toastHost');
    const t = document.createElement('div');
    t.className = 'toast';
    t.innerHTML = '<span>'+KK.esc(msg)+'</span>'+(label?'<button type="button">'+KK.esc(label)+'</button>':'');
    if(label && fn) t.querySelector('button').onclick = ()=>{ fn(); t.remove(); };
    host.appendChild(t);
    setTimeout(()=>t.remove(), 3600);
  };

  /* 浮层占位：AI 助手和修改面板共用右侧位置，打开时页面收窄 */
  KK.sideOpen = () => S.asst.open || S.edit.open;

  /* 历史快照：每次修改前存一份，可撤销 */
  KK.snapshot = function(tool){
    const snap = tool==='qc' ? clone({rules:S.qc.rules, showGuide:S.qc.showGuide, onlyFail:S.qc.onlyFail, groupBy:S.qc.groupBy, rankTop:S.qc.rankTop})
                             : clone({store:S.biz.store, renew:S.biz.renew, focus:S.biz.focus, hide:S.biz.hide, version:S.biz.version});
    S.history[tool].push(snap);
  };
  KK.undo = function(tool){
    const snap = S.history[tool].pop();
    if(!snap){ KK.toast('没有可以撤销的改动'); return; }
    if(tool==='qc'){ Object.assign(S.qc, snap); S.qc.changed = {}; }
    else Object.assign(S.biz, snap);
    KK.render();
    KK.toast(tool==='qc' ? '已撤销，恢复为门店标准 v'+S.qc.rules.version : '已撤销，恢复为口径 v'+S.biz.version);
  };

  /* 路由 */
  KK.go = function(route){
    S.route = route;
    if(route.name!=='tool'){ S.asst.open = false; S.edit.open = false; }
    else if(S.asst.tool!==route.id){ S.asst.open = false; S.edit.open = false; S.asst.tool = route.id; S.asst.ref = null; S.edit.ref = null; S.edit.draft = null; S.edit.msgs = []; }
    S.qc.drawer = null;
    KK.render();
    document.getElementById('view').scrollTop = 0;
  };

  KK.render = function(){
    KK.renderSidebar();
    const v = document.getElementById('view');
    const r = S.route;
    if(r.name==='home') v.innerHTML = KK.renderHome();
    else if(r.name==='chat') v.innerHTML = KK.renderChat();
    else if(r.name==='tool' && r.id==='qc') v.innerHTML = KK.renderQC();
    else if(r.name==='tool' && r.id==='biz') v.innerHTML = KK.renderBiz();
    KK.renderFloat();
    if(KK.afterRender) KK.afterRender();
  };
  KK.renderFloat = function(){
    const f = document.getElementById('floatLayer');
    let html = '';
    if(S.route.name==='tool'){
      if(S.route.id==='qc' && S.qc.drawer) html += KK.renderDrawer();
      html += S.edit.open ? KK.renderEditor() : S.asst.open ? KK.renderAssistant() : KK.renderFab();
    }
    f.innerHTML = html;
    if(S.edit.open && KK.afterEditor) KK.afterEditor();
    else if(S.asst.open && KK.afterAssistant) KK.afterAssistant();
  };

  /* 事件：data-act 分发 */
  KK.actions = {};
  document.addEventListener('click', e=>{
    const el = e.target.closest('[data-act]');
    if(!el) return;
    const fn = KK.actions[el.dataset.act];
    if(fn){ e.preventDefault(); fn(el, e); }
  });
})();

</script>

    ['presale', /(排期|档期|改期|化妆|预约|客资|门市|谈单|客情|客服|定金|空档)/]
  ];
  const route = t => { for(const [id, re] of rules) if(re.test(t)) return id; return 'qc'; };
  const toolCard = id => { const t = KK.tools[id];
    return '<button class="toolcard" data-act="'+(t.ready?'open-tool':'tool-soon')+'" data-id="'+id+'"><span class="tool-ico '+(t.color==='green'?'ti-green':'ti-blue')+'">'+I(t.icon,16,2)+'</span><span><b>'+t.name+'</b><span>'+t.desc+'</span></span><span class="go btn btn-line btn-sm">'+(t.ready?'打开应用':'即将上线')+'</span></button>'; };
  const chips = {
    qc:['每天 21:00 把验货结果推给摄影主管','王浩这周的达标情况怎么样'],
    biz:['每周一 9:00 把经营周报推给老板','万达店下午场是哪几位选片师'],
    sales:['帮我准备下午 3 点周岁客户的选片预案','新人小杨最近 9 单的复盘'],
    service:['把过生日的老客做成回访名单','这个月的美团好评统计'],
    presale:['周六只接已付定金的客户，帮我提醒客服','下周哪天还有空档']
  };

  function answer(id, t){
    t = t || '';
    if(id==='qc'){
      if(/(删片|修图|追色|调色|初修|排版)/.test(t)) return '<p>把订单号发我，我先按“连拍重复、闭眼、虚焦”挑一遍，每组留 2 张给你终选。</p>'+toolCard('cull');
      if(/(样片|主题|服装)/.test(t)) return '<p>收到。我先按门店现有的主题和服装，出两套方案和拍摄建议，样片包可以直接推给摄影师。</p>'+toolCard('pack');
      if(/(这周|本周|上周)/.test(t)) return '<p>演示数据只有 11 月 2 日一天。接入后可以按日、周、月看每位摄影师的达标情况。</p>'+toolCard('qc');
      const fails = KK.qcOrders.map(o=>({o, r:KK.qcEval(o, S.qc.rules)})).filter(x=>!x.r.pass);
      const wh = fails.filter(x=>x.o.pg==='王浩').length;
      return '<p>昨天（11 月 2 日）共 12 单，按门店标准有 '+fails.length+' 单没达标：</p>'+
        '<table class="mini-tbl"><tr><th>宝宝</th><th>摄影师</th><th>问题</th></tr>'+fails.map(x=>'<tr><td>'+x.o.baby+'（'+x.o.age+'）</td><td>'+x.o.pg+'</td><td>'+x.r.reason+'</td></tr>').join('')+'</table>'+
        '<p>王浩昨天 3 单里 '+wh+' 单没达标，重片也最多（'+KK.qcStats(S.qc.rules).topRate+'%），建议先和他对一下延拍要求。明细和照片在应用里：</p>'+toolCard('qc');
    }
    if(id==='biz') return '<p>10 月营业额 ¥86.4 万，环比 +6.2%。要注意两件事：</p><ul><li>10/29–10/31 加选率连续 3 天低于 40%，集中在万达店下午场。</li><li>预收未拍 ¥27.5 万，其中 18 单超过 90 天没约。</li></ul><p>完整数据和周会材料在应用里：</p>'+toolCard('biz');
    if(id==='sales'){
      if(/(下午场|小杨|哪几位)/.test(t)) return '<p>10/29–10/31 万达店下午场加选率最低的是新人小杨：9 单，加选率 24%，其余选片师 47%。这 9 单里有 6 单没有讲特色版，录音里也没有提成长套续订。</p><p>建议选片主管这周按门店标准复盘他的录音。</p>'+toolCard('review');
      return '<p>可以。我会结合这位客户的门市录音、客情和套餐，列出选片时的重点和推荐清单。</p><p>选片复盘应用下一批上线，现在可以先在这里说客户姓名或订单号。</p>'+toolCard('review');
    }
    if(id==='service'){
      if(/好评/.test(t)) return '<p>10 月美团好评 214 条，其中优质好评（3 张图以上、100 字以上）61 条，已按订单对应到摄影、选片和引导老师。</p>'+toolCard('praise');
      return '<p>11 月过生日的老客有 23 位，其中 9 位的成长套还有未拍次数。我可以按孩子年龄写好邀约话术，你确认后再发。</p>'+toolCard('praise');
    }
    if(/(定金|提醒客服)/.test(t)) return '<p>好的。我会在今晚 21:00 前提醒客服组：11 月 8 日（周六）只接已付定金的客户。发送前会先给你看消息内容。</p>'+toolCard('sched');
    if(/空档/.test(t)) return '<p>下周（11/9–11/15）化妆还有空档：周二全天、周四上午、周日下午 2 组。周六已约满 92%。</p>'+toolCard('sched');
    return '<p>11 月 8 日（周六）化妆档期已约 92%，再约 2 组就会超负荷。建议今天起周六只接已付定金的客户。</p>'+toolCard('sched');
  }

  KK.startChat = function(text){
    const picked = S.mounted || route(text);
    S.chat = { expert:picked, auto:!S.mounted, msgs:[{ role:'u', text }], typing:true };
    S.draft = ''; S.mounted = null;
    KK.go({ name:'chat' });
    setTimeout(()=>{ S.chat.typing = false; S.chat.msgs.push({ role:'a', ex:picked, html:answer(picked, text) }); if(S.route.name==='chat') KK.render(); }, 900);
  };
  KK.renderChat = function(){
    const c = S.chat, ex = KK.expert(c.expert);
    const who = e => '<div class="who"><img src="'+e.av+'" alt="">'+esc(e.name)+'</div>';
    let m = '', last = ex;
    c.msgs.forEach((x,i)=>{
      if(x.role==='u'){ m += '<div class="msg-u">'+esc(x.text)+'</div>';
        if(i===0 && c.auto) m += '<div class="notice" style="align-self:flex-start">'+I('sparkle',15)+'已为你请来 '+esc(ex.name)+'（'+esc(ex.desc)+'）</div>'; }
      else { const e = KK.expert(x.ex || c.expert); last = e; m += '<div class="msg-a">'+who(e)+x.html+'</div>'; }
    });
    if(c.typing) m += '<div class="msg-a">'+who(last)+'<span class="typing"><i></i><i></i><i></i></span></div>';
    else m += '<div class="qchips" style="flex-wrap:wrap">'+chips[last.id].map((q,k)=>{ const e = KK.expert(route(q));
      return '<button class="qchip" data-act="chat-fill" data-t="'+esc(q)+'">'+I(k===0?'clock':'talk',15)+esc(q)+' · '+esc(e.name)+(e.id===last.id?'（当前）':'')+'</button>'; }).join('')+'</div>';
    return KK.topActions()+'<div class="chat"><div class="chat-h">'+esc(c.msgs[0].text)+'</div><div class="chat-b"><div class="chat-col">'+m+'</div></div><div class="chat-f">'+KK.composer({id:'chatInput', send:'chat-send', ph:'继续追问 '+last.name})+'</div></div>';
  };
  Object.assign(KK.actions, {
    'chat-send':()=>{ const t = S.draft.trim(); if(!t) return; S.draft = '';
      S.chat.msgs.push({ role:'u', text:t }); S.chat.typing = true; KK.render();
      setTimeout(()=>{ S.chat.typing = false;
        const auto = /(每天|每周|推送|推给)/.test(t);
        const lastA = S.chat.msgs.filter(x=>x.role==='a').slice(-1)[0];
        const e = auto ? ((lastA && lastA.ex) || S.chat.expert) : route(t);
        if(auto) KK.addAutomation(t);
        const html = auto ? '<p>好的，已创建自动化任务：「'+esc(t)+'」。可以在左侧“自动化任务”里改时间或暂停。</p>' : answer(e, t);
        S.chat.msgs.push({ role:'a', ex:e, html }); KK.render(); }, 800); },
    'chat-fill':el=>{ S.draft = el.dataset.t; KK.actions['chat-send'](); }
  });
})();

<script>
/* 摄影品控应用页 */
(function(){
  const S = KK.state, I = KK.icon, esc = KK.esc;
  KK.qcEval = function(o, r){
    const short = { main:0, e1:0, e2:0 }, min = { main:99, e1:99, e2:99 };
    o.cs.forEach(c=>['main','e1','e2'].forEach(k=>{ min[k] = Math.min(min[k], c[k]); short[k] += Math.max(0, r[k]-c[k]); }));
    const lab = { main:'主拍', e1:'延拍一', e2:'延拍二' };
    const parts = ['main','e1','e2'].filter(k=>short[k]>0).map(k=>lab[k]+'差 '+short[k]+' 张');
    const valid = o.cs.reduce((a,c)=>a+c.main+c.e1+c.e2, 0);
    const brief = parts.length>1 ? parts.map(x=>x.replace(' 张','')).join(' · ') : (parts[0]||'达标');
    return { pass:!parts.length, reason:parts.length?parts.join(' · '):'达标', brief, short, min, valid, total:valid+o.dup+o.waste };
  };
  KK.qcStats = function(rules){
    const rs = KK.qcOrders.map(o=>({ o, r:KK.qcEval(o, rules) }));
    const pass = rs.filter(x=>x.r.pass).length;
    const valid = rs.reduce((a,x)=>a+x.r.valid,0), total = rs.reduce((a,x)=>a+x.r.total,0), dup = rs.reduce((a,x)=>a+x.o.dup,0);
    const pg = {};
    rs.forEach(x=>{ const p = pg[x.o.pg] = pg[x.o.pg] || { d:0, t:0 }; p.d += x.o.dup; p.t += x.r.total; });
    const top = Object.keys(pg).sort((a,b)=>pg[b].d/pg[b].t - pg[a].d/pg[a].t)[0];
    return { rs, pass, fail:rs.length-pass, avg:Math.round(valid/rs.length), dupRate:(dup/total*100).toFixed(1),
      top, topRate:(pg[top].d/pg[top].t*100).toFixed(1), topDup:pg[top].d };
  };
  function cell(v, std, changed){
    return '<td class="num'+(changed?' col-new':'')+'"><span class="'+(v<std?'bad':'')+'">'+v+'</span><span class="std"> / '+std+'</span></td>';
  }
  function table(st){
    const q = S.qc, kw = (q.kw||'').trim();
    let rows = st.rs.filter(x=>!q.onlyFail || !x.r.pass).filter(x=>!kw || (x.o.baby+x.o.pg+x.o.id+x.o.guide).includes(kw));
    if(q.groupBy==='pg'){
      const g = {};
      st.rs.forEach(x=>{ const p = g[x.o.pg] = g[x.o.pg] || { n:0, pass:0, valid:0, dup:0 }; p.n++; if(x.r.pass) p.pass++; p.valid += x.r.valid; p.dup += x.o.dup; });
      return '<table class="tbl"><thead><tr><th>摄影师</th><th>单数</th><th>达标</th><th>未达标</th><th>平均有效片</th><th>重片</th><th>达标率</th></tr></thead><tbody>'+
        Object.keys(g).filter(k=>!q.onlyFail || g[k].pass<g[k].n).map(k=>{ const p = g[k], rate = Math.round(p.pass/p.n*100);
          return '<tr data-act="qc-pg" data-id="'+k+'"'+(q.changed.pg?' class="is-new"':'')+'><td><div class="who" style="flex-direction:row;align-items:center;gap:8px">'+KK.letterAv(k[0], KK.photographers[k].c, 24)+'<b>'+k+'</b></div></td><td class="num">'+p.n+'</td><td class="num">'+p.pass+'</td><td class="num'+(p.n-p.pass?' bad':'')+'">'+(p.n-p.pass)+'</td><td class="num">'+Math.round(p.valid/p.n)+'</td><td class="num">'+p.dup+'</td><td><span class="pill '+(rate<60?'pill-err':'pill-ok')+'">'+rate+'%</span></td></tr>'; }).join('')+'</tbody></table>';
    }
    if(!rows.length) return '<div class="empty">没有符合条件的订单</div>';
    const r = q.rules, ch = q.changed;
    return '<table class="tbl"><thead><tr><th>订单</th><th class="c-opt">套系 · 服装</th><th>摄影师</th>'+(q.showGuide?'<th'+(ch.guide?' class="col-new"':'')+'>引导师</th>':'')+
      '<th>主拍</th><th>延拍一</th><th>延拍二</th><th class="c-opt">重片</th><th class="c-opt">废片</th><th>结果</th><th class="c-opt"></th></tr></thead><tbody>'+
      rows.map(x=>{ const o = x.o, e = x.r;
        return '<tr data-act="qc-open" data-id="'+o.id+'"'+(ch.rows&&ch.rows.includes(o.id)?' class="is-new"':'')+'><td><div class="who"><b>'+o.baby+' · '+o.age+'</b><span class="oid">'+o.id+'</span></div></td>'+
          '<td class="c-opt"><div class="who"><b>'+o.pkg+'</b><span>'+o.cs.length+' 套服装 · '+o.time+'</span></div></td><td>'+o.pg+'</td>'+(q.showGuide?'<td'+(ch.guide?' class="col-new"':'')+'>'+o.guide+'</td>':'')+
          cell(e.min.main, r.main, ch.main)+cell(e.min.e1, r.e1, ch.e1)+cell(e.min.e2, r.e2, ch.e2)+
          '<td class="num c-opt">'+o.dup+'</td><td class="num c-opt">'+o.waste+'</td>'+
          '<td><span class="pill '+(e.pass?'pill-ok':'pill-err')+'">'+(e.pass?I('check',12,2.4)+'<span class="pt">达标</span>':'<span class="pt" title="'+e.reason+'">'+e.brief+'</span>')+'</span></td><td class="c-opt"><span class="lnk">照片 ›</span></td></tr>'; }).join('')+'</tbody></table>';
  }
  function rank(st){
    const g = {};
    st.rs.forEach(x=>{ const p = g[x.o.pg] = g[x.o.pg] || { n:0, pass:0 }; p.n++; if(x.r.pass) p.pass++; });
    return '<div class="rank">'+Object.keys(g).sort((a,b)=>g[b].pass/g[b].n-g[a].pass/g[a].n).map(k=>{ const p = g[k], rate = Math.round(p.pass/p.n*100);
      return '<div class="rank-row">'+KK.letterAv(k[0], KK.photographers[k].c, 24)+'<span>'+k+'</span><span class="bar"><i class="'+(rate<60?'low':'')+'" style="width:'+rate+'%"></i></span><span class="num tnum" style="text-align:right">'+p.pass+'/'+p.n+'</span></div>'; }).join('')+'</div>';
  }
  function rulesPanel(){
    const r = S.qc.rules, ch = S.qc.changed;
    const row = (k, t) => '<div class="rule'+(ch[k]?' is-changed':'')+'"><span>'+t+'</span><b>≥ '+r[k]+' 张 / 套</b></div>';
    return '<div class="rules">'+row('main','主拍有效片')+row('e1','延拍一')+row('e2','延拍二')+
      '<div class="rule-note">重片：同一姿势、同一表情的连拍只算 1 张。<br>废片：闭眼、虚焦、穿帮不计入有效片。</div></div>';
  }
  const panel = (title, sub, ref, body) => '<section class="panel'+(S.edit.open&&S.edit.panel===ref?' is-target':'')+'"><div class="panel-h"><h3>'+title+'</h3><span class="sub">'+sub+'</span><span class="sp"></span><button class="ai-edit" data-act="edit-ref" data-ref="'+ref+'">'+I('pencil',13)+'改这里</button></div>'+body+'</section>';

  KK.renderQC = function(){
    const q = S.qc, st = KK.qcStats(q.rules), v = q.rules.version;
    const head = '<header class="tool-head"><span class="crumb"><button data-act="nav-home">摄影影楼</button>'+I('chevR',13)+'</span><span class="tool-ico ti-blue">'+I('shield',16,2)+'</span><span class="tool-name">摄影品控</span>'+
      '<button class="ver'+(q.changed.ver?' is-new':'')+'" data-act="qc-ver">门店标准 v'+v+(q.changed.ver?' · 刚刚修改':'')+'</button><span class="src"><span class="dot"></span>恒友 ERP · 今天 10:32 同步 · AI修图原片</span><span class="sp"></span>'+
      '<button class="btn btn-line" data-act="qc-export">'+I('download',16)+'导出验货表</button><button class="btn btn-dark" data-act="qc-push">'+I('send2',15)+'推送主管</button><button class="icon-btn" data-act="nav-stub" aria-label="更多">'+I('more',18)+'</button></header>';
    const filters = '<div class="filters"><div class="seg"><button class="is-active">昨天 11/02</button><button data-act="qc-day">今天</button><button data-act="qc-day">本周</button></div>'+
      '<button class="sel" data-act="nav-stub">'+I('store',15)+KK.store.branch+I('chevD',13)+'</button><label class="search">'+I('search',15)+'<input id="qcSearch" placeholder="搜宝宝、摄影师、订单号" value="'+esc(q.kw||'')+'"></label>'+
      '<button class="switch'+(q.onlyFail?' is-on':'')+'" data-act="qc-onlyfail"><i></i>只看未达标</button></div>';
    const kpis = '<div class="kpis"><div class="kpi"><div class="l">待验订单</div><div class="v tnum">'+st.rs.length+'<small>单</small></div><div class="c">共 '+KK.qcOrders.reduce((a,o)=>a+o.cs.length,0)+' 套服装</div></div>'+
      '<div class="kpi"><div class="l">达标</div><div class="v tnum">'+st.pass+'<small>单</small></div><div class="c">达标率 '+Math.round(st.pass/st.rs.length*100)+'%</div></div>'+
      '<div class="kpi is-err"><div class="l">未达标</div><div class="v tnum">'+st.fail+'<small>单</small></div><div class="c">需要主管复核</div></div>'+
      '<div class="kpi"><div class="l">平均有效片</div><div class="v tnum">'+st.avg+'<small>张/单</small></div><div class="c">重复、废片已剔除</div></div>'+
      '<div class="kpi"><div class="l">重片率</div><div class="v tnum">'+st.dupRate+'<small>%</small></div><div class="c">'+st.top+' '+st.topRate+'%，最高</div></div></div>';
    const tbl = panel('验货明细', q.groupBy==='pg'?'按摄影师汇总':'按订单 · 点击行看照片', '验货明细', '<div class="tbl-wrap">'+table(st)+'</div>');
    const rk = panel('摄影师达标', '昨天', '摄影师达标', '<div class="panel-b">'+rank(st)+'</div>');
    const rp = panel('当前标准', '门店标准 v'+v, '当前标准', '<div class="panel-b">'+rulesPanel()+'</div>');
    const body = q.rankTop ? '<div class="grid-2 two">'+rk+rp+'</div><div style="margin-top:16px">'+tbl+'</div>'
                           : '<div class="grid-2"><div>'+tbl+'</div><div>'+rk+rp+'</div></div>';
    return '<div class="tool fade-in'+(KK.sideOpen()?' asst-open':'')+(S.edit.open?' is-editing':'')+'">'+head+KK.editBar()+'<div class="tool-body">'+filters+kpis+body+'</div></div>';
  };
})();

<script>
/* 摄影品控：订单照片抽屉 */
(function(){
  const S = KK.state, I = KK.icon, esc = KK.esc;
  const lab = { main:'主拍', e1:'延拍一', e2:'延拍二' };
  function thumbs(oi, ci, o){
    const pool = KK.photoPool, dupN = Math.min(2, Math.ceil(o.dup / o.cs.length / 2)), wasteN = ci < o.waste ? 1 : 0;
    let h = '';
    for(let k=0; k<6; k++){
      const src = pool[(oi*5 + ci*3 + k) % pool.length];
      let cls = '', flag = '';
      if(k>=1 && k<=dupN){ cls = 'dim'; flag = '<span class="flag dup">重片</span>'; }
      else if(k===5 && wasteN){ const blur = (oi+ci)%2===0; cls = blur?'blur':'dim'; flag = '<span class="flag err">'+(blur?'虚焦':'闭眼')+'</span>'; }
      h += '<div class="ph '+cls+'"><img src="'+src+'" alt="" loading="lazy">'+flag+'</div>';
    }
    return h;
  }
  function advice(o, r){
    const items = [];
    o.cs.forEach((c,i)=>['main','e1','e2'].forEach(k=>{ if(c[k] < r[k]) items.push('第 '+(i+1)+' 套「'+c.name+'」'+lab[k]+'只有 '+c[k]+' 张，差 '+(r[k]-c[k])+' 张'); }));
    if(!items.length) return '各套服装都达到门店标准。另有 '+o.dup+' 张同姿势连拍已按 1 张计。';
    return items.join('；')+'。另有 '+o.dup+' 张重片未计入。建议今天联系家长补拍，或在选片前告诉选片师。';
  }
  KK.renderDrawer = function(){
    const oi = KK.qcOrders.findIndex(x=>x.id===S.qc.drawer);
    const o = KK.qcOrders[oi], r = S.qc.rules, e = KK.qcEval(o, r);
    let b = '';
    o.cs.forEach((c,ci)=>{
      const short = ['main','e1','e2'].filter(k=>c[k]<r[k]);
      b += '<div class="costume"><div class="costume-h">第 '+(ci+1)+' 套 · '+esc(c.name)+'<span class="sp"></span>'+
        (short.length?'<span class="pill pill-err">'+short.map(k=>lab[k]+'差 '+(r[k]-c[k])).join(' · ')+'</span>':'<span class="pill pill-ok">'+I('check',12,2.4)+'达标</span>')+'</div>'+
        '<div class="counts">'+['main','e1','e2'].map(k=>'<span class="cnt'+(c[k]<r[k]?' bad':'')+'">'+lab[k]+' '+c[k]+' / '+r[k]+'</span>').join('')+'</div>'+
        '<div class="photos">'+thumbs(oi, ci, o)+'</div></div>';
    });
    return '<div class="drawer-mask" data-act="qc-close"></div><aside class="drawer" role="dialog" aria-label="订单照片">'+
      '<div class="drawer-h"><div><h3>'+o.baby+' · '+o.age+'　<span class="pill '+(e.pass?'pill-ok':'pill-err')+'">'+(e.pass?'达标':e.reason)+'</span></h3>'+
      '<div class="meta">'+o.id+' · '+o.pkg+' · '+o.cs.length+' 套服装<br>摄影 '+o.pg+' · 引导 '+o.guide+' · 11 月 2 日 '+o.time+' · 有效片 '+e.valid+' 张</div></div><span class="sp"></span>'+
      '<button class="icon-btn" data-act="qc-close" aria-label="关闭">'+I('x',18)+'</button></div>'+
      '<div class="drawer-b"><div class="ai-note"><span class="orb"></span><span>'+advice(o, r)+'</span></div>'+b+
      '<div class="sample-note">照片为 AI 生成的示例图，接入后显示 AI修图客户端里该订单的原片。</div></div>'+
      '<div class="drawer-f"><button class="btn btn-line" data-act="qc-back" data-id="'+o.id+'">'+I('send2',15)+'通知摄影师补拍</button><button class="btn btn-dark" data-act="qc-checked">'+I('check',15,2.2)+'标记已复核</button></div></aside>';
  };
  Object.assign(KK.actions, {
    'qc-open':el=>{ S.qc.drawer = el.dataset.id; KK.renderFloat(); },
    'qc-close':()=>{ S.qc.drawer = null; KK.renderFloat(); },
    'qc-back':el=>{ const o = KK.qcOrders.find(x=>x.id===el.dataset.id);
      KK.toast('已通过企业微信通知 '+o.pg+'：'+o.baby+' 需要补拍', '撤回', ()=>KK.toast('已撤回通知')); },
    'qc-checked':()=>{ S.qc.drawer = null; KK.renderFloat(); KK.toast('已标记复核，结果会写回恒友 ERP 订单备注'); }
  });
})();

</script>
<script>
/* 经营分析应用页 */
(function(){
  const S = KK.state, I = KK.icon;
  function chart(data){
    const W = 760, H = 230, x0 = 46, x1 = 744, y0 = 18, y1 = 196;
    const max = Math.ceil(Math.max(...data)/10000)*10000;
    const X = i => x0 + (x1-x0)*i/(data.length-1), Y = v => y1 - (y1-y0)*v/max;
    let g = '';
    for(let k=0; k<=4; k++){ const v = max*k/4, y = Y(v); g += '<line x1="'+x0+'" x2="'+x1+'" y1="'+y+'" y2="'+y+'"/><text x="'+(x0-8)+'" y="'+(y+4)+'" text-anchor="end">'+(v? (v/10000)+'万':'0')+'</text>'; }
    let wk = '';
    data.forEach((v,i)=>{ const dow = (4+i)%7; if(dow===6){ wk += '<rect class="wk" x="'+(X(i)-6)+'" y="'+y0+'" width="'+(X(Math.min(i+1,data.length-1))-X(i)+12)+'" height="'+(y1-y0)+'" rx="3"/>'; } });
    const pts = data.map((v,i)=>X(i).toFixed(1)+','+Y(v).toFixed(1)).join(' ');
    const peak = data.indexOf(Math.max(...data));
    let ax = '';
    [1,5,10,15,20,25,31].forEach(d=>{ ax += '<text x="'+X(d-1)+'" y="'+(y1+20)+'" text-anchor="middle">10/'+d+'</text>'; });
    return '<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="10 月每日营业额"><defs><linearGradient id="areaGrad" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#191c1f" stop-opacity=".12"/><stop offset="1" stop-color="#191c1f" stop-opacity="0"/></linearGradient></defs>'+
      wk+'<g class="grid axis">'+g+'</g><polygon class="area" points="'+X(0)+','+y1+' '+pts+' '+X(data.length-1)+','+y1+'"/><polyline class="line" points="'+pts+'"/>'+
      '<circle class="pt" cx="'+X(peak)+'" cy="'+Y(data[peak])+'" r="4"/><text x="'+X(peak)+'" y="'+(Y(data[peak])-10)+'" text-anchor="middle" style="font-size:11px;fill:#191c1f">'+(data[peak]/10000).toFixed(1)+' 万</text><g class="axis">'+ax+'</g></svg>';
  }
  const panel = (title, sub, ref, body, extra) => '<section class="panel'+(S.edit.open&&S.edit.panel===ref?' is-target':'')+'"><div class="panel-h"><h3>'+title+'</h3><span class="sub">'+sub+'</span><span class="sp"></span>'+(extra||'')+'<button class="ai-edit" data-act="edit-ref" data-ref="'+ref+'">'+I('pencil',13)+'改这里</button></div>'+body+'</section>';
  function kpis(){
    const k = KK.bizKpi[S.biz.store], d = KK.bizDelta, aov = Math.round(k.rev/k.orders);
    const item = (l, v, delta, good, cls) => '<div class="kpi'+(cls||'')+'"><div class="l">'+l+'</div><div class="v tnum">'+v+'</div><div class="c">环比 9 月 <span class="delta '+(good?'up':'down')+'">'+delta+'</span></div></div>';
    let list = [ item('营业额', KK.money(k.rev), d.rev, true), item('订单数', k.orders+'<small>单</small>', d.orders, true),
      item('客单价', '¥'+KK.fmt(aov), d.aov, true), item('选片加选率', k.add+'<small>%</small>', d.add, false),
      item('二销金额', KK.money(k.sec), d.sec, true), item('预收未拍', KK.money(k.pre), d.pre, false) ];
    const keys = ['rev','orders','aov','add','sec','pre'], hide = S.biz.focus ? ['orders','aov'] : (S.biz.hide||[]);
    list = list.filter((x,i)=>!hide.includes(keys[i]));
    if(S.biz.renew) list.push(item('续订率', k.renew+'<small>%</small>', d.renew, true, ' is-new'));
    return '<div class="kpis k6">'+list.join('')+'</div>';
  }
  KK.renderBiz = function(){
    const b = S.biz, st = KK.bizStores[b.store];
    const head = '<header class="tool-head"><span class="crumb"><button data-act="nav-home">摄影影楼</button>'+I('chevR',13)+'</span><span class="tool-ico ti-green">'+I('chart',16,2)+'</span><span class="tool-name">经营分析</span>'+
      '<button class="ver'+(b.flash?' is-new':'')+'" data-act="biz-ver">财务口径 v'+b.version+(b.flash?' · 刚刚修改':'')+'</button><span class="src"><span class="dot"></span>恒友 ERP · 今天 09:00 同步</span><span class="sp"></span>'+
      '<button class="btn btn-line" data-act="biz-weekly">'+I('doc',16)+'生成周会材料</button><button class="btn btn-dark" data-act="biz-push">'+I('send2',15)+'推送老板</button><button class="icon-btn" data-act="nav-stub" aria-label="更多">'+I('more',18)+'</button></header>';
    const seg = '<div class="seg">'+Object.keys(KK.bizStores).map(k=>'<button class="'+(b.store===k?'is-active':'')+'" data-act="biz-store" data-id="'+k+'">'+KK.bizStores[k].name+'</button>').join('')+'</div>';
    const filters = '<div class="filters"><button class="sel" data-act="nav-stub">'+I('calendar',15)+'2026 年 10 月'+I('chevD',13)+'</button>'+seg+'<span class="muted" style="font-size:12px;margin-left:auto">金额含二销，不含预收；口径在「修改」里查看</span></div>';
    const data = KK.bizDaily(b.store);
    const src = '<div class="panel-b"><div class="hbars">'+KK.bizSources.map(s=>{ const n = Math.round(KK.bizKpi[b.store].orders*s.p/100);
      return '<div class="hbar"><span>'+s.n+'</span><span class="bar"><i style="width:'+(s.p/34*100)+'%"></i></span><span class="v">'+n+' 单 · '+s.p+'%</span></div>'; }).join('')+'</div></div>';
    const pk = '<table class="tbl"><thead><tr><th>套系</th><th>订单</th><th>营业额</th><th>占比</th></tr></thead><tbody>'+KK.bizPackages.map((p,i)=>{ const r = Math.round(p.r*st.share);
      return '<tr><td><span class="pk-rank">'+(i+1)+'</span>'+p.n+'</td><td class="num">'+Math.round(p.o*st.share)+'</td><td class="num">'+KK.money(r)+'</td><td class="num">'+Math.round(p.r/KK.bizKpi.all.rev*100)+'%</td></tr>'; }).join('')+'</tbody></table>';
    const al = '<div class="panel-b"><div class="alerts">'+KK.bizAlerts.map((a,i)=>'<div class="alert"><span class="lv" style="background:var(--'+a.lv+')"></span><div><div class="t">'+a.t+'</div><div class="d">'+a.d+'</div></div><button class="go" data-act="biz-alert" data-i="'+i+'">'+a.go+' ›</button></div>').join('')+'</div></div>';
    const body = kpis()+
      '<div class="grid-3" style="margin-top:0">'+panel('营业额走势', '每日 · 灰底为周末', '营业额走势', '<div class="chart-wrap">'+chart(data)+'</div>')+panel('客资来源', '按成交订单', '客资来源', src)+'</div>'+
      '<div class="grid-3">'+panel('套系销售 TOP5', st.name, '套系销售', pk)+panel('需要关注', '由数据自动发现', '需要关注', al)+'</div>';
    return '<div class="tool fade-in'+(KK.sideOpen()?' asst-open':'')+(S.edit.open?' is-editing':'')+'">'+head+KK.editBar()+'<div class="tool-body">'+filters+body+'</div></div>';
  };
})();

</script>

      sugUse:[['查','search','这个月营业额多少？'],['查','search','哪个套系卖得最好？'],['问','talk','加选率为什么掉了？'],['用','doc','生成本周周会材料']],
      sugMod:[['指标','target','加一个指标：续订率'],['筛选','store','只看艺术馆的数据'],['页面','layout','只留我最关心的 4 个指标'],['自定义','sparkle','这个页面不好用，帮我重新排一下']],
      chips:[['search','查数据','哪个套系卖得最好？'],['talk','问原因','加选率为什么掉了？'],['doc','周会材料','生成本周周会材料'],['clock','定时推送','每周一 9:00 推送给老板']],
      refs:()=>({ '营业额走势':[S.biz.store==='art'?'看全部门店的数据':'只看艺术馆的数据'], '客资来源':['加选率为什么掉了？'], '套系销售':[S.biz.store==='art'?'看全部门店的数据':'只看艺术馆的数据'], '需要关注':['每周一 9:00 推送给老板'] }) }
  };
  KK.addAutomation = t => { if(!S.automations.find(a=>a.t===t)) S.automations.push({ t }); KK.renderSidebar(); };
  KK.propose = function(apply, label){ const id = 'p'+(++pid); KK.pending[id] = { apply, label }; return id; };
  KK.cardActs = (id, scopes, ok) => '<div class="acts" data-pid="'+id+'">'+(scopes?'<button class="btn btn-dark btn-sm" data-act="asst-apply" data-id="'+id+'" data-scope="全店">应用到全店</button><button class="btn btn-line btn-sm" data-act="asst-apply" data-id="'+id+'" data-scope="我">只改我的</button>':'<button class="btn btn-dark btn-sm" data-act="asst-apply" data-id="'+id+'" data-scope="我">'+(ok||'确认修改')+'</button>')+'<button class="btn btn-ghost btn-sm" data-act="asst-cancel" data-id="'+id+'">取消</button></div>';

  KK.renderFab = () => '<div class="fab2"><button class="fab-btn fab-edit" data-act="edit-open">'+I('pencil',16)+'修改</button><button class="fab-btn fab-ai" data-act="asst-open"><span class="orb"></span>AI 助手</button></div>';
  KK.renderAssistant = function(){
    const t = S.asst.tool, c = KK.asstCfg[t], ex = KK.expert(c.ex), msgs = S.asstMsgs[t];
    let b = '';
    if(!msgs.length){
      const list = c.sugUse;
      b = '<div class="hello"><span class="orb lg"></span><h4>问问这张报表</h4><p>'+c.use+'</p></div>'+
        '<div class="sugs">'+list.map(s=>'<button class="sug" data-act="asst-say" data-t="'+esc(s[2])+'">'+I(s[1],17).replace('<svg','<svg class="l"')+'<span class="txt">'+esc(s[2])+'</span><span class="k">'+s[0]+'</span>'+I('chevR',15).replace('<svg','<svg class="r"')+'</button>').join('')+'</div>'+
        '<div class="notice">'+I('info',15)+'<span>回答只用本店数据。想直接改页面，用「修改」。</span><button data-act="edit-open">去修改</button></div>';
    } else {
      b = '<div class="msgs">'+msgs.map(m=> m.role==='u' ? '<div class="msg-u">'+esc(m.text)+'</div>' : '<div class="msg-a"><div class="who"><img src="'+ex.av+'" alt="" style="width:18px;height:18px;border-radius:50%">'+ex.name+'</div>'+m.html+'</div>').join('')+
        (S.asst.typing?'<div class="msg-a"><span class="typing"><i></i><i></i><i></i></span></div>':'')+'</div>';
    }
    const chips = '<div class="qchips">'+c.chips.map(x=>'<button class="qchip" data-act="asst-say" data-t="'+esc(x[2])+'">'+I(x[0],15)+x[1]+'</button>').join('')+'</div>';
    const ref = S.asst.ref ? '<span class="ref-chip">@'+esc(S.asst.ref)+'<button data-act="asst-unref" aria-label="移除引用">'+I('x',11,2)+'</button></span>' : '';
    return '<section class="asst" role="dialog" aria-label="AI 助手"><div class="asst-h"><span class="ttl"><span class="orb" style="width:18px;height:18px"></span>AI 助手 · '+ex.name+'</span><span class="sp"></span>'+
      '<button class="icon-btn" data-act="asst-new" aria-label="新对话">'+I('newchat',17)+'</button><button class="icon-btn" data-act="edit-open" aria-label="切到修改" title="切到修改">'+I('pencil',17)+'</button><button class="icon-btn" data-act="asst-close" aria-label="收起">'+I('x',17)+'</button></div>'+
      '<div class="asst-b" id="asstBody">'+b+'</div><div class="asst-f">'+chips+'<div class="ainput">'+ref+'<textarea id="asstInput" placeholder="问问这张表，比如：昨天哪几单没达标？"></textarea>'+
      '<div class="row"><button class="cbtn" data-act="nav-stub" aria-label="添加">'+I('plus',17)+'</button><button class="cbtn" data-act="nav-stub" aria-label="引用">'+I('at',17)+'</button><span class="grow"></span><button class="send" data-act="asst-send" aria-label="发送">'+I('up',15,2.2)+'</button></div></div></div></section>';
  };
  KK.afterAssistant = () => { const b = document.getElementById('asstBody'); if(b) b.scrollTop = b.scrollHeight; };

  KK.asstSay = function(text){
    const t = S.asst.tool; S.asstMsgs[t].push({ role:'u', text }); S.asst.typing = true; KK.renderFloat();
    setTimeout(()=>{
      S.asst.typing = false;
      const hit = (KK.intents[t]||[]).find(x=>x.re.test(text));
      const html = hit ? hit.run(text) : KK.intentFallback(t);
      S.asstMsgs[t].push({ role:'a', html }); KK.render();
    }, 650);
  };
  KK.intentFallback = t => { const c = KK.asstCfg[t];
    const list = S.edit.open ? c.sugMod : c.sugUse.concat(c.sugMod.slice(0,1));
    return '<p>'+(S.edit.open?'这条演示版还改不了，已经记下。可以先试试这些改法：':'这个问题演示版还答不了，已经记下。可以先试试这些：')+'</p><div class="opts">'+list.map(s=>'<button class="opt" data-act="asst-say" data-t="'+esc(s[2])+'">'+esc(s[2])+I('chevR',14)+'</button>').join('')+'</div>'; };

  KK.say = text => S.edit.open ? KK.editSay(text) : KK.asstSay(text);
  const outList = () => S.edit.open ? S.edit.msgs : S.asstMsgs[S.asst.tool];
  Object.assign(KK.actions, {
    'asst-open':()=>{ S.edit.open = false; S.asst.open = true; S.asst.mode = 'use'; S.asst.ref = null; KK.render(); },
    'asst-close':()=>{ S.asst.open = false; S.asst.ref = null; KK.render(); },
    'asst-new':()=>{ S.asstMsgs[S.asst.tool] = []; S.asst.ref = null; KK.renderFloat(); },
    'asst-hist':()=>{ const h = S.history[S.asst.tool]; KK.toast(h.length ? '本次已修改 '+h.length+' 次，可逐次撤销' : '还没有修改记录', h.length?'撤销上一次':'', ()=>KK.undo(S.asst.tool)); },
    'asst-unref':()=>{ S.asst.ref = null; KK.render(); },
    'asst-say':el=>KK.say(el.dataset.t),
    'asst-send':()=>{ const ta = document.getElementById('asstInput'); const v = ta && ta.value.trim(); if(v) KK.asstSay(v); },
    'asst-apply':el=>{ const p = KK.pending[el.dataset.id]; if(!p) return; delete KK.pending[el.dataset.id];
      const msg = p.apply(el.dataset.scope);
      outList().push({ role:'a', html:msg }); KK.render(); },
    'asst-cancel':el=>{ delete KK.pending[el.dataset.id]; outList().push({ role:'a', html:'<p>好的，保持原样。</p>' }); KK.renderFloat(); },
    'asst-undo':()=>{ KK.undo(S.asst.tool); outList().push({ role:'a', html:'<p>已撤销上一次修改。</p>' }); KK.renderFloat(); }
  });
})();

</script>
<script>
/* 修改模式：直接改规则、页面和推送，也能用一句话改 */
(function(){
  const S = KK.state, I = KK.icon, esc = KK.esc;
  const lab = { main:'主拍', e1:'延拍一', e2:'延拍二' };
  const AUTO = { qc:'每天 21:00 推送验货结果给摄影主管', biz:'每周一 9:00 推送经营周报给老板' };
  const REF = { qc:{ '验货明细':'page', '当前标准':'rule', '摄影师达标':'page' }, biz:{ '营业额走势':'filter', '客资来源':'kpi', '套系销售':'filter', '需要关注':'push' } };
  const KPI = [['rev','营业额'],['orders','订单数'],['aov','客单价'],['add','选片加选率'],['sec','二销金额'],['pre','预收未拍']];
  const tool = () => S.route.id;
  const hasAuto = t => S.automations.some(a=>a.t===t);
  const sec = (id, title, sub, body) => '<section class="es'+(S.edit.ref===id?' is-focus':'')+'" data-sec="'+id+'"><div class="es-h"><b>'+title+'</b><span>'+sub+'</span></div>'+body+'</section>';
  const sw = (on, act, label, k) => '<button class="es-row" data-act="'+act+'"'+(k?' data-k="'+k+'"':'')+'><span>'+label+'</span><span class="switch'+(on?' is-on':'')+'"><i></i></span></button>';

  KK.editBar = () => S.edit.open ? '<div class="edit-bar">'+I('pencil',14)+'修改模式：在右侧直接改，或点模块上的「改这里」<button data-act="edit-close">退出修改</button></div>' : '';

  function qcRule(){
    const r = S.qc.rules, d = S.edit.draft || r;
    let h = '<div class="es-rules">'+['main','e1','e2'].map(k=>'<div class="es-num'+(d[k]!==r[k]?' is-diff':'')+'"><span>'+lab[k]+'有效片</span><div class="stp"><button data-act="edit-step" data-k="'+k+'" data-d="-1" aria-label="减少">−</button><b class="tnum">'+d[k]+'</b><button data-act="edit-step" data-k="'+k+'" data-d="1" aria-label="增加">+</button></div><em>张 / 套</em></div>').join('')+'</div>';
    if(S.edit.draft){
      const a = KK.qcStats(r), b = KK.qcStats(d);
      const flip = a.rs.filter((x,i)=>x.r.pass!==b.rs[i].r.pass).map(x=>x.o.baby+'（'+x.o.pg+'）');
      h += '<div class="impact">影响：昨天 12 单，达标 '+a.pass+' 单 → <b>'+b.pass+' 单</b>'+(flip.length?'；结果会变的：'+flip.join('、'):'；没有订单的结果会变')+'</div>'+
        '<div class="acts"><button class="btn btn-dark btn-sm" data-act="edit-rule-apply" data-scope="全店">应用到全店</button><button class="btn btn-line btn-sm" data-act="edit-rule-apply" data-scope="我">只改我的</button><button class="btn btn-ghost btn-sm" data-act="edit-rule-cancel">取消</button></div>';
    }
    return h+'<div class="es-note">先看影响，确认后升级为门店标准 v'+(r.version+1)+'。</div>';
  }
  function qcBody(){
    const q = S.qc;
    return sec('rule','验货规则','门店标准 v'+q.rules.version, qcRule())+
      sec('page','页面','只改你的页面', sw(q.showGuide,'edit-toggle','验货明细显示「引导师」','showGuide')+sw(q.groupBy==='pg','edit-toggle','按摄影师汇总','groupBy')+sw(q.rankTop,'edit-toggle','摄影师达标放到最上面','rankTop')+sw(q.onlyFail,'edit-toggle','只看未达标','onlyFail')+'<button class="es-link" data-act="edit-sync">同步给全店</button>')+
      sec('push','推送','企业微信', sw(hasAuto(AUTO.qc),'edit-auto',AUTO.qc));
  }
  function bizBody(){
    const b = S.biz, hide = b.focus ? ['orders','aov'] : b.hide;
    return sec('kpi','指标卡','勾选要显示的', KPI.map(k=>sw(!hide.includes(k[0]),'edit-kpi',k[1],k[0])).join('')+sw(b.renew,'edit-kpi','续订率（新）','renew'))+
      sec('filter','默认门店','打开时显示', '<div class="seg es-seg">'+Object.keys(KK.bizStores).map(k=>'<button class="'+(b.store===k?'is-active':'')+'" data-act="edit-store" data-id="'+k+'">'+KK.bizStores[k].name+'</button>').join('')+'</div>')+
      sec('rule','财务口径','财务口径 v'+b.version, '<div class="es-kv"><span>营业额</span><b>含二销，不含预收</b></div><div class="es-kv"><span>加选率</span><b>有加选的选片单 / 全部选片单</b></div><div class="es-note">口径改动要财务确认后生效。</div>')+
      sec('push','推送','企业微信', sw(hasAuto(AUTO.biz),'edit-auto',AUTO.biz));
  }
  KK.renderEditor = function(){
    const t = tool(), n = S.history[t].length;
    const ms = S.edit.msgs.map(m=> m.role==='u' ? '<div class="msg-u">'+esc(m.text)+'</div>' : '<div class="msg-a">'+m.html+'</div>').join('')+(S.edit.typing?'<div class="msg-a"><span class="typing"><i></i><i></i><i></i></span></div>':'');
    return '<section class="asst editp" role="dialog" aria-label="修改应用"><div class="asst-h"><span class="ttl">'+I('pencil',16)+'修改 · '+KK.tools[t].name+'</span><span class="sp"></span>'+
      '<button class="icon-btn" data-act="edit-undo" aria-label="撤销上一次"'+(n?'':' disabled')+'>'+I('history',17)+'</button><button class="btn btn-dark btn-sm" data-act="edit-close">完成</button></div>'+
      '<div class="asst-b" id="editBody"><div class="ainput es-say"><textarea id="editInput" placeholder="说一句话改，比如：'+(t==='qc'?'表格加一列引导师':'加一个指标：续订率')+'"></textarea><div class="row"><span class="grow"></span><button class="send" data-act="edit-send" aria-label="发送">'+I('up',15,2.2)+'</button></div></div>'+
      (ms?'<div class="msgs es-msgs">'+ms+'</div>':'')+(t==='qc'?qcBody():bizBody())+
      '<div class="es-foot">'+I('info',14)+'每次修改都存一个版本'+(n?'，本次已改 '+n+' 次':'')+'，可以撤销。</div></div></section>';
  };

  KK.editSay = function(text){
    const t = tool(); S.edit.msgs.push({ role:'u', text }); S.edit.typing = true; KK.renderFloat();
    setTimeout(()=>{
      S.edit.typing = false;
      const hit = (KK.intents[t]||[]).find(x=>x.re.test(text));
      S.edit.msgs.push({ role:'a', html: hit ? hit.run(text) : KK.intentFallback(t) }); KK.render();
    }, 600);
  };
  KK.afterEditor = function(){
    const ta = document.getElementById('editInput');
    if(ta) ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); KK.actions['edit-send'](); } });
    const f = document.querySelector('.es.is-focus');
    if(f && !S.edit.msgs.length) f.scrollIntoView({ block:'nearest' });
  };
  const open = (ref, panel) => { S.asst.open = false; S.edit.open = true; S.edit.ref = ref||null; S.edit.panel = panel||null; KK.render(); };
  const keep = sec => { S.edit.ref = sec; };
  Object.assign(KK.actions, {
    'edit-open':()=>open(null, null),
    'edit-ref':el=>open(REF[tool()][el.dataset.ref], el.dataset.ref),
    'asst-ref':el=>open(REF[tool()][el.dataset.ref], el.dataset.ref),
    'edit-close':()=>{ S.edit.open = false; S.edit.draft = null; S.edit.ref = null; S.edit.panel = null; KK.render(); },
    'edit-send':()=>{ const ta = document.getElementById('editInput'); const v = ta && ta.value.trim(); if(v) KK.editSay(v); },
    'edit-undo':()=>{ S.edit.draft = null; KK.undo(tool()); },
    'edit-step':el=>{
      const k = el.dataset.k, base = S.edit.draft || S.qc.rules, v = Math.max(1, base[k] + (+el.dataset.d));
      S.edit.draft = Object.assign({}, base, { [k]:v });
      if(['main','e1','e2'].every(x=>S.edit.draft[x]===S.qc.rules[x])) S.edit.draft = null;
      keep('rule'); KK.renderFloat(); },
    'edit-rule-cancel':()=>{ S.edit.draft = null; KK.renderFloat(); },
    'edit-rule-apply':el=>{
      const r = S.qc.rules, d = S.edit.draft; if(!d) return;
      const a = KK.qcStats(r), b = KK.qcStats(d);
      const rows = a.rs.filter((x,i)=>x.r.pass!==b.rs[i].r.pass).map(x=>x.o.id);
      KK.snapshot('qc'); S.qc.rules = Object.assign({}, d, { version:r.version+1 });
      S.qc.changed = { ver:true, rows }; ['main','e1','e2'].forEach(k=>{ if(d[k]!==r[k]) S.qc.changed[k] = true; });
      S.edit.draft = null; keep('rule'); KK.render();
      KK.toast((el.dataset.scope==='全店'?'已应用到全店':'已改你的视图')+'，门店标准升到 v'+S.qc.rules.version, '撤销', ()=>KK.undo('qc')); },
    'edit-toggle':el=>{
      const k = el.dataset.k, q = S.qc; KK.snapshot('qc');
      if(k==='groupBy'){ q.groupBy = q.groupBy==='pg' ? 'order' : 'pg'; q.kw = ''; q.changed = q.groupBy==='pg' ? { pg:true } : {}; }
      else { q[k] = !q[k]; q.changed = (k==='showGuide' && q.showGuide) ? { guide:true } : {}; }
      keep('page'); KK.render(); KK.toast('已改，只对你的页面生效', '撤销', ()=>KK.undo('qc')); },
    'edit-sync':()=>KK.toast('页面改动已同步给全店（演示）'),
    'edit-auto':()=>{
      const a = AUTO[tool()], on = hasAuto(a);
      S.automations = on ? S.automations.filter(x=>x.t!==a) : S.automations.concat([{ t:a }]);
      keep('push'); KK.render(); KK.toast(on ? '已关闭：'+a : '已创建自动化任务：'+a); },
    'edit-kpi':el=>{
      const k = el.dataset.k, b = S.biz;
      if(k!=='renew'){
        const hide = b.focus ? ['orders','aov'] : b.hide.slice();
        const next = hide.includes(k) ? hide.filter(x=>x!==k) : hide.concat([k]);
        if(next.length>=KPI.length && !b.renew){ KK.toast('至少保留一个指标'); return; }
        KK.snapshot('biz'); b.focus = false; b.hide = next;
      } else { KK.snapshot('biz'); b.renew = !b.renew; }
      b.flash = true; keep('kpi'); KK.render(); KK.toast('已改，只对你的页面生效', '撤销', ()=>KK.undo('biz')); },
    'edit-store':el=>{ KK.snapshot('biz'); S.biz.store = el.dataset.id; keep('filter'); KK.render(); }
  });
})();

</script>
<script>
/* 摄影品控助手：改规则、改页面 */
(function(){
  const S = KK.state, I = KK.icon;
  const lab = { main:'主拍', e1:'延拍一', e2:'延拍二' };
  const undo = '<div class="undo-line">'+I('history',13)+'已存为新版本<button data-act="asst-undo">撤销</button></div>';
  const mark = (keys) => { S.qc.changed = Object.assign({}, keys); };
  function ruleChange(t){
    const k = /延拍一/.test(t) ? 'e1' : /延拍二/.test(t) ? 'e2' : 'main';
    const n = parseInt((t.match(/(\d+)/)||[])[1], 10);
    if(!n) return '<p>改成每套多少张？比如“主拍改成每套 25 张”。</p>';
    const cur = S.qc.rules[k];
    if(n===cur) return '<p>'+lab[k]+'现在就是每套 '+n+' 张，不用改。</p>';
    const next = Object.assign({}, S.qc.rules, { [k]:n });
    const a = KK.qcStats(S.qc.rules), b = KK.qcStats(next);
    const flip = a.rs.filter((x,i)=>x.r.pass !== b.rs[i].r.pass);
    const names = flip.map(x=>x.o.baby+'（'+x.o.pg+'）').join('、');
    const id = KK.propose(scope=>{
      KK.snapshot('qc'); S.qc.rules = Object.assign(next, { version:S.qc.rules.version+1 });
      mark({ ver:true, [k]:true, rows:flip.map(x=>x.o.id) });
      return '<p>已改好：'+lab[k]+'每套 '+cur+' 张 → <b>'+n+' 张</b>，门店标准升到 v'+S.qc.rules.version+'。'+(scope==='全店'?'全店摄影师今晚起按新标准验货，规则同步给“绩效核算”和摄影主管。':'只对你的视图生效，店里其他人仍按 v'+(S.qc.rules.version-1)+'。')+'</p>'+undo;
    });
    return '<p>好的，先看一下改完的影响：</p><div class="card"><div class="ch">'+I('target',15)+'改动预览<span class="pill pill-gray">门店标准 v'+S.qc.rules.version+' → v'+(S.qc.rules.version+1)+'</span></div>'+
      '<div class="diff"><span class="k">'+lab[k]+'</span><s>'+cur+' 张 / 套</s>'+I('chevR',13)+'<b>'+n+' 张 / 套</b></div>'+
      '<div class="impact">昨天 12 单：达标 '+a.pass+' 单 → <b>'+b.pass+' 单</b>。'+(flip.length?(n>cur?'新增未达标：':'变为达标：')+names+'。':'没有订单的结果会变。')+'</div>'+KK.cardActs(id, true)+'</div>';
  }
  function layout(desc, fn, scopes){
    const id = KK.propose(scope=>{ KK.snapshot('qc'); fn(); return '<p>已改好：'+desc+'。'+(scope==='全店'?'全店看到的页面都会更新。':'只改了你的页面。')+'</p>'+undo; });
    return '<div class="card"><div class="ch">'+I('layout',15)+'页面改动<span class="pill pill-gray">不影响验货规则</span></div><div class="diff">'+desc+'</div>'+KK.cardActs(id, scopes)+'</div>';
  }
  const quick = (desc, fn) => { KK.snapshot('qc'); fn(); setTimeout(KK.render, 0); return '<p>'+desc+'</p>'+undo; };
  KK.intents.qc = [
    { re:/(去掉|删掉|不要).*引导师|引导师.*(去掉|删掉)/, run:()=>quick('已去掉「引导师」这一列。', ()=>{ S.qc.showGuide = false; }) },
    { re:/(显示全部|全部订单)/, run:()=>quick('已恢复显示全部 12 单。', ()=>{ S.qc.onlyFail = false; }) },
    { re:/(按订单看|改回按订单)/, run:()=>quick('已改回按订单看。', ()=>{ S.qc.groupBy = 'order'; S.qc.kw = ''; }) },
    { re:/(放回|右边)/, run:()=>quick('已把“摄影师达标”放回右边。', ()=>{ S.qc.rankTop = false; }) },
    { re:/(本周|这周|上周)/, run:()=>'<p>演示数据只有 11 月 2 日一天。接入后，这里可以按日、周、月切换，周数据每天 21:00 汇总一次。</p>' },
    { re:/(主拍|延拍一|延拍二).*(\d+)|(\d+).*(主拍|延拍)/, run:ruleChange },
    { re:/引导师/, run:()=>layout('验货明细加一列「引导师」，数据来自恒友 ERP 订单', ()=>{ S.qc.showGuide = true; mark({ guide:true }); }, true) },
    { re:/(按摄影师|摄影师汇总)/, run:()=>layout('验货明细改为按摄影师汇总：单数、达标、平均有效片、重片', ()=>{ S.qc.groupBy = 'pg'; mark({ pg:true }); }, true) },
    { re:/(只看未达标|未达标的单)/, run:()=>{ KK.snapshot('qc'); S.qc.onlyFail = true; setTimeout(KK.render, 0); return '<p>已打开“只看未达标”，现在表格里只剩 '+KK.qcStats(S.qc.rules).fail+' 单。</p>'+undo; } },
    { re:/(最上面|放到上面|放上面)/, run:()=>layout('把“摄影师达标”和“当前标准”放到页面最上面', ()=>{ S.qc.rankTop = true; mark({}); }, false) },
    { re:/(不好用|不太合用|换个|重新排|自定义|习惯|太乱|太多|看不懂)/, run:()=>
      '<p>这个应用是按大多数影楼的验货习惯搭的，可以按你店里的习惯改。哪里不顺手？选一个我直接改：</p><div class="opts">'+
      ['只看未达标的单','按摄影师汇总，不按订单','把摄影师达标放到最上面','表格加一列：引导师'].map(x=>'<button class="opt" data-act="asst-say" data-t="'+x+'">'+x+I('chevR',14)+'</button>').join('')+
      '<button class="opt" data-act="asst-say" data-t="都不是，我直接说">都不是，我直接说'+I('chevR',14)+'</button></div>' },
    { re:/都不是/, run:()=>'<p>直接说就行，比如“表格里不要废片这一列”“重片率放到第一个”“周末单独统计”。我改完先给你预览。</p>' }
  ];
})();

</script>
<script>
/* 摄影品控助手：查数据、问原因、导出、定时；页面按钮 */
(function(){
  const S = KK.state, I = KK.icon;
  function sheet(){
    const st = KK.qcStats(S.qc.rules);
    return '<p>验货表生成好了，按门店标准 v'+S.qc.rules.version+' 统计：</p><div class="card"><div class="file"><span class="fi">XLS</span><div><b>验货表_11月2日_'+KK.store.branch+'.xlsx</b><span>'+st.rs.length+' 单 · 达标 '+st.pass+' · 未达标 '+st.fail+' · 含照片链接</span></div></div>'+
      '<div class="acts"><button class="btn btn-line btn-sm" data-act="qc-export">'+I('download',14)+'下载</button><button class="btn btn-dark btn-sm" data-act="qc-push">'+I('send2',14)+'推给摄影主管 王丽</button></div></div>';
  }
  function auto(){
    const id = KK.propose(()=>{ KK.addAutomation('每天 21:00 推送验货结果给摄影主管'); return '<p>已创建自动化任务。今晚 21:00 第一次推送，可以在左侧“自动化任务”里改时间或暂停。</p>'; });
    return '<div class="card"><div class="ch">'+I('clock',15)+'新建自动化任务</div><div class="diff"><span class="k">时间</span>每天 21:00（当天拍摄结束后）</div><div class="diff"><span class="k">推送给</span>摄影主管 王丽 · 企业微信</div><div class="diff"><span class="k">内容</span>验货汇总、未达标明细、照片链接</div>'+KK.cardActs(id, false)+'</div>';
  }
  function why(){
    const st = KK.qcStats(S.qc.rules);
    return '<p>王浩昨天 3 单共 '+st.topDup+' 张重片，占他拍摄量的 '+st.topRate+'%，全店是 '+st.dupRate+'%。主要有两个原因：</p><ul><li>同一姿势连拍 5–8 张，表情变化不大。</li><li>果果、甜甜两单延拍不够，补拍时又重复了主拍的姿势。</li></ul>'+
      '<p>可以这样处理：</p><div class="opts"><button class="opt" data-act="asst-say" data-t="每天 21:00 自动推送验货结果">每天把验货结果推给摄影主管'+I('chevR',14)+'</button><button class="opt" data-act="qc-open-ref" data-id="HY20261102-038">打开甜甜这单看照片'+I('chevR',14)+'</button></div>';
  }
  function listFail(){
    const st = KK.qcStats(S.qc.rules), f = st.rs.filter(x=>!x.r.pass);
    if(!f.length) return '<p>昨天 '+st.rs.length+' 单全部达标（门店标准 v'+S.qc.rules.version+'）。</p>';
    return '<p>昨天 '+st.rs.length+' 单里有 '+f.length+' 单没达标（门店标准 v'+S.qc.rules.version+'）：</p><ul>'+f.map(x=>'<li>'+x.o.baby+' · '+x.o.age+'（'+x.o.pg+'）：'+x.r.reason+'</li>').join('')+'</ul>'+
      '<div class="opts"><button class="opt" data-act="asst-say" data-t="只看未达标的单">表格只看这 '+f.length+' 单'+I('chevR',14)+'</button><button class="opt" data-act="qc-open-ref" data-id="'+f[0].o.id+'">打开'+f[0].o.baby+'这单看照片'+I('chevR',14)+'</button></div>';
  }
  KK.intents.qc.unshift({ re:/(哪几单|哪些单|几单没|没达标|不达标)/, run:listFail });
  KK.intents.qc.push(
    { re:/(验货表|导出|生成昨天|直接使用)/, run:sheet },
    { re:/(每天|定时|自动推送|21)/, run:auto },
    { re:/(为什么|原因|王浩)/, run:why }
  );

  Object.assign(KK.actions, {
    'qc-export':()=>KK.toast('已生成 验货表_11月2日_'+KK.store.branch+'.xlsx（演示）'),
    'qc-push':()=>KK.toast('已推送给摄影主管 王丽（企业微信）', '撤回', ()=>KK.toast('已撤回')),
    'qc-ver':()=>{ const n = S.history.qc.length; KK.toast('门店标准 v'+S.qc.rules.version+(n?'，本次改了 '+n+' 次':'，由店长在 10 月 20 日确认'), n?'撤销上一次':'', ()=>KK.undo('qc')); },
    'qc-day':()=>KK.toast('演示数据只有 11 月 2 日这一天'),
    'qc-onlyfail':()=>{ S.qc.onlyFail = !S.qc.onlyFail; KK.render(); },
    'qc-open-ref':el=>{ S.qc.drawer = el.dataset.id; KK.renderFloat(); },
    'qc-pg':el=>{ S.qc.groupBy = 'order'; S.qc.kw = el.dataset.id; KK.render(); KK.toast('已切回按订单看，只显示 '+el.dataset.id+' 的单', '撤销', ()=>{ S.qc.groupBy = 'pg'; S.qc.kw = ''; KK.render(); }); }
  });
})();

</script>
<script>

    { re:/(4 个|四个|最关心|只留)/, run:()=>change('指标区只留 营业额、加选率、二销金额、预收未拍', ()=>{ S.biz.focus = true; }, false) },
    { re:/(每周一|定时|推送给老板|9:00)/, run:()=>{ const id = KK.propose(()=>{ KK.addAutomation('每周一 9:00 推送经营周报给老板'); return '<p>已创建自动化任务，下周一 9:00 第一次推送。</p>'; });
      return '<div class="card"><div class="ch">'+I('clock',15)+'新建自动化任务</div><div class="diff"><span class="k">时间</span>每周一 9:00</div><div class="diff"><span class="k">推送给</span>曾总 · 企业微信</div><div class="diff"><span class="k">内容</span>上周经营小结、需要关注的 3 件事</div>'+KK.cardActs(id, false)+'</div>'; } },
    { re:/(为什么|原因|加选率)/, run:()=>'<p>10/29–10/31 加选率掉到 38%，主要在万达店下午场：</p><ul><li>新人选片师小杨这 3 天接了 9 单，加选率 24%，其余选片师 47%。</li><li>这 9 单里有 6 单没有讲特色版，录音里也没有提到成长套续订。</li></ul><p>建议让选片主管这周复盘小杨的录音。</p>'+opts(['每周一 9:00 推送给老板']) },
    { re:/(不好用|不太合用|换个|重新排|自定义|习惯|太乱|太多|看不懂)/, run:()=>'<p>这个应用按大多数影楼的月会习惯搭的，可以按你店里的习惯改。选一个我直接改：</p>'+opts(['只留我最关心的 4 个指标','加一个指标：续订率','只看艺术馆的数据','都不是，我直接说']) },

</script>
<script>
/* 启动与输入框绑定 */
(function(){
  const S = KK.state;
  function bindComposer(id, sendAct){
    const ta = document.getElementById(id);
    if(!ta) return;
    const btn = ta.closest('.composer').querySelector('.send');
    ta.addEventListener('input', ()=>{ S.draft = ta.value; btn.disabled = !ta.value.trim(); });
    ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); KK.actions[sendAct](); } });
  }
  let clearTimer = null;
  KK.afterRender = function(){
    bindComposer('homeInput', 'home-send');
    bindComposer('chatInput', 'chat-send');
    const qs = document.getElementById('qcSearch');
    if(qs){
      qs.addEventListener('input', ()=>{ S.qc.kw = qs.value; const pos = qs.selectionStart; KK.render(); const n = document.getElementById('qcSearch'); n.focus(); n.setSelectionRange(pos, pos); });
    }
    const cb = document.querySelector('.chat-b');
    if(cb) cb.scrollTop = cb.scrollHeight;
    /* 高亮动画只播一次 */
    clearTimeout(clearTimer);
    clearTimer = setTimeout(()=>{ ['main','e1','e2','rows','guide','pg'].forEach(k=>delete S.qc.changed[k]); S.qc.flashCols = false; }, 2000);
  };
  const baseAfterAsst = KK.afterAssistant;
  KK.afterAssistant = function(){
    baseAfterAsst();
    const ta = document.getElementById('asstInput');
    if(ta) ta.addEventListener('keydown', e=>{ if(e.key==='Enter' && !e.shiftKey && !e.isComposing){ e.preventDefault(); KK.actions['asst-send'](); } });
  };
  const go = KK.go;
  KK.go = function(r){ S.qc.changed = {}; S.biz.flash = null; go(r); };
  document.addEventListener('keydown', e=>{
    if(e.key==='Escape'){
      if(S.qc.drawer){ S.qc.drawer = null; KK.renderFloat(); }
      else if(S.edit.open){ S.edit.open = false; S.edit.draft = null; KK.render(); }
      else if(S.asst.open){ S.asst.open = false; KK.render(); }
    }
  });
  /* 支持用 #qc / #biz 直接打开应用，方便评审时分享 */
  const h = location.hash.replace('#','');
  if(h==='qc' || h==='biz') S.route = { name:'tool', id:h }, S.asst.tool = h;
  window.addEventListener('hashchange', ()=>{
    const k = location.hash.replace('#','');
    if(k==='qc' || k==='biz') KK.go({ name:'tool', id:k });
    else if(!k) KK.go({ name:'home' });
  });
  KK.render();
})();

</script>
